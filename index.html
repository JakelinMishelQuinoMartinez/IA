<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campuslands Chatbot</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- DEFER: PROPIEDAD BULEANA PARA QUE SE CARGUE DEPUÈS DEL HTML -->
    <script src="./script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="./assets/campuslands-banner.png" class="brand-logo" alt="Campuslands" onerror="this.style.display='none'">
        </div>
        <div class="settings">
            <select name="modeloSelect" id="modeloSelect" title="Modelo">
                <!-- AL COLOCAR 'SELECTED' SERÁ LA OPCIÓN POR DEFECTO -->
                <option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>
                <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            </select>
            <!-- ========== Selector de personalidad ========== -->
            <select name="personalitySelect" id="personalitySelect" title="Personalidad">
                <option value="./agentes_de_personalidad/jarvis.json" selected>Jarvis (Mentor)</option>
            </select>
            <button id="clearChatBtn" class="ghost" title="Borrar Converesasión">Borrar</button>
        </div>
    </header>

    <main class="chat">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer" autocomplete="off">
            <textarea name="prompt" id="prompt" placeholder="Escribe tu mensaje aquí y presiona Enter..." required></textarea>
            <div class="composer-actions">
                <button id="sendBtn" type="submit">Enviar</button>
            </div>
        </form>

    </main>
</body>
</html>
